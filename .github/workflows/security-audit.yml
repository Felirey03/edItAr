name: Security Audit CI

on:
  push:
    branches: [ main, master, security/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    name: Run npm audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run Security Audit
        run: |
          npm audit --json > audit.json || true
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const vuln = a.metadata && a.metadata.vulnerabilities ? a.metadata.vulnerabilities : {};
            const high = vuln.high || 0;
            const critical = vuln.critical || 0;
            if (high + critical > 0) {
              console.error(\`Found \${critical} critical and \${high} high vulnerabilities\`);
              console.error(JSON.stringify(a, null, 2));
              process.exit(1);
            }
            console.log('No high or critical vulnerabilities found. Moderate/low vulnerabilities are reported but do not fail CI.');
          "
